flush ruleset

table inet filter {
	# Web and loopback traffic is accepted by port, so it skips connection
	# tracking: a burst of connections cannot fill the table (about 4096
	# entries on 512 MB, each closed connection holds one for 2 minutes),
	# which drops every new packet on the host, SSH included
	chain notrack_in {
		type filter hook prerouting priority raw;
		iif lo notrack
		tcp dport { 80, 443 } notrack
		udp dport 443 notrack
	}
	chain notrack_out {
		type filter hook output priority raw;
		oif lo notrack
		tcp sport { 80, 443 } notrack
		udp sport 443 notrack
	}
	# New SSH connections per source in the last minute. IPv6 is keyed on the
	# /64, since a single host usually has the whole prefix to rotate through.
	# Ansible reuses one connection (ControlPersist), so deploys stay well under.
	set ssh_v4 {
		type ipv4_addr; flags dynamic; timeout 5m;
	}
	set ssh_v6 {
		type ipv6_addr; flags dynamic; timeout 5m;
	}
	chain input {
		type filter hook input priority 0; policy drop;
		iif lo accept
		ct state established,related accept
		ct state invalid drop
		meta l4proto { icmp, ipv6-icmp } accept
		udp dport 68 accept
		tcp dport 22 ct state new update @ssh_v4 { ip saddr limit rate over 10/minute burst 10 packets } drop
		tcp dport 22 ct state new update @ssh_v6 { ip6 saddr and ffff:ffff:ffff:ffff:: limit rate over 10/minute burst 10 packets } drop
		tcp dport { 22, 80, 443 } accept
		udp dport 443 accept
	}
	chain forward {
		type filter hook forward priority 0; policy drop;
	}
}
