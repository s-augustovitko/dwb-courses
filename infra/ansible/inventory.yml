# One host per environment. The Makefile picks it with DEPLOY_ENV (--limit) and
# loads its .deploy.<env>.env, where everything below comes from.
all:
  hosts:
    stage:
    prod:
  vars:
    ansible_host: "{{ lookup('env', 'DEPLOY_HOST') }}"
    ansible_port: "{{ lookup('env', 'DEPLOY_SSH_PORT') | default(22, true) }}"
    ansible_ssh_private_key_file: "{{ lookup('env', 'DEPLOY_SSH_KEY') | expanduser }}"
