name: Build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SQLC_VERSION: 1.31.1
  BUN_VERSION: 1.4.4

jobs:
  go:
    name: Build Go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: ${{ env.SQLC_VERSION }}
      # internal/database is gitignored and generated by sqlc
      - run: sqlc generate
      # CGO is required by github.com/mattn/go-sqlite3 (same as infra/Dockerfile)
      - run: go build ./...
        env:
          CGO_ENABLED: "1"

  web:
    name: Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build
