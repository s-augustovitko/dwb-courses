name: Lint

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.15.0
  SQLC_VERSION: 1.31.1
  BUN_VERSION: 1.4.4

jobs:
  go:
    name: Lint Go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: ${{ env.SQLC_VERSION }}
      # internal/database is gitignored and generated by sqlc
      - run: sqlc generate
      - run: sqlc vet
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
      # --diff exits 1 on unformatted files instead of rewriting them
      - run: golangci-lint fmt --diff

  web:
    name: Lint Web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # read-only equivalent of `bun run lint` (which writes fixes)
      - run: bunx biome ci .
